
name: Update EVE reprocessing data

on:
  workflow_dispatch:
  push:
    paths:
      - 'build_data.py'
      - '.github/workflows/update-eve-data.yml'
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and validate EVE static data
        run: python build_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eve-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh EVE static reprocessing data'
            git push
          fi

